<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>슬롯 초기화</title>
<style>
body{font-family:sans-serif;max-width:500px;margin:4rem auto;padding:1rem;text-align:center}
button{padding:14px 32px;background:#1677ff;color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer;margin-top:1rem}
button:disabled{background:#ccc;cursor:not-allowed}
#log{margin-top:1.5rem;text-align:left;background:#f5f5f5;padding:1rem;border-radius:8px;font-size:13px;max-height:300px;overflow-y:auto;line-height:1.8}
</style>
</head>
<body>
<h2>🔧 슬롯 초기화</h2>
<p>Firebase에 60개 슬롯을 생성합니다.<br>최초 1회만 실행하세요.</p>
<button id="btn" onclick="initSlots()">슬롯 60개 생성 시작</button>
<div id="log"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, doc, setDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

// ✅ index.html과 동일한 Firebase 설정값 붙여넣기
const firebaseConfig = {
  apiKey: "AIzaSyCJwtXqltcejM9jA07IzEjhq9qSXGBr0g0",
  authDomain: "bada-library.firebaseapp.com",
  projectId: "bada-library",
  storageBucket: "bada-library.firebasestorage.app",
  messagingSenderId: "615532147657",
  appId: "1:615532147657:web:e4e5458a9171a312adee18"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const DATES=['8월 11일(화)','8월 12일(수)','8월 13일(목)'];
const PROGS=['Ocean Maracas','My Beach Bag','Ocean Breeze Fan','Ding a Ring Guitar'];
const TIMES=['16시','17시','18시','19시','20시'];
const CAP=4;

function log(msg){
  const el=document.getElementById('log');
  el.innerHTML+=msg+'<br>';
  el.scrollTop=el.scrollHeight;
}

window.initSlots=async function(){
  const btn=document.getElementById('btn');
  btn.disabled=true;
  btn.textContent='생성 중...';
  log('슬롯 생성 시작...');
  let count=0;
  try{
    for(const d of DATES){
      for(const p of PROGS){
        for(const t of TIMES){
          const k=`${d}__${p}__${t}`;
          await setDoc(doc(db,'slots',k),{
            date:d, prog:p, time:t,
            count:0, capacity:CAP, notified:false
          });
          count++;
          log(`✅ ${count}/60 — ${d} / ${p} / ${t}`);
        }
      }
    }
    log('<strong>🎉 완료! 60개 슬롯 생성됨</strong>');
    btn.textContent='완료!';
  }catch(e){
    log('❌ 오류: '+e.message);
    btn.disabled=false;
    btn.textContent='다시 시도';
  }
}
</script>
</body>
</html>
