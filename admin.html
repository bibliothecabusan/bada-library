<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[운영자] 들락날락 영어랑 놀자</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;font-size:15px;color:#1a1a1a;background:#f5f5f3;min-height:100vh}
.wrap{max-width:900px;margin:0 auto;padding:1.5rem 1rem 4rem}
.header{margin-bottom:1.5rem;display:flex;justify-content:space-between;align-items:flex-start}
.header h1{font-size:20px;font-weight:600;margin-bottom:4px}
.header p{font-size:13px;color:#888}
.admin-badge{background:#fff2f0;color:#a8071a;border:1px solid #ffccc7;border-radius:6px;padding:4px 12px;font-size:12px;font-weight:600}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1.5rem}
.metric{background:#fff;border:1px solid #e8e8e8;border-radius:10px;padding:.75rem 1rem}
.metric-label{font-size:12px;color:#aaa;margin-bottom:4px}
.metric-value{font-size:22px;font-weight:600;color:#1a1a1a}
.card{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:1.25rem 1.5rem;margin-bottom:1rem}
.card-title{font-size:15px;font-weight:600;margin-bottom:1rem;display:flex;align-items:center;justify-content:space-between}
.stitle{font-size:14px;font-weight:600;color:#555;margin:1.25rem 0 .5rem}
.nlog{background:#f9f9f9;border-radius:8px;padding:.75rem;font-size:13px;max-height:200px;overflow-y:auto;border:1px solid #e8e8e8}
.nitem{padding:7px 0;border-bottom:1px solid #efefef;display:flex;gap:8px;align-items:flex-start}
.nitem:last-child{border-bottom:none}
.nitem-dot{width:8px;height:8px;border-radius:50%;background:#1677ff;margin-top:4px;flex-shrink:0}
.empty{text-align:center;padding:2rem;color:#bbb;font-size:14px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:.75rem;align-items:center}
.flabel{font-size:13px;color:#555;font-weight:500}
.fbtn{padding:5px 12px;border-radius:20px;border:1px solid #d9d9d9;background:#fff;color:#555;font-size:13px;cursor:pointer;font-family:inherit}
.fbtn.on{background:#e6f4ff;border-color:#4096ff;color:#1677ff;font-weight:500}
.atbl-wrap{overflow-x:auto;border:1px solid #e8e8e8;border-radius:10px}
.atbl{width:100%;font-size:13px;border-collapse:collapse;min-width:700px}
.atbl th{text-align:left;padding:9px 12px;background:#fafafa;border-bottom:1px solid #e8e8e8;color:#888;font-weight:500;font-size:12px}
.atbl td{padding:9px 12px;border-bottom:1px solid #f0f0f0;color:#1a1a1a}
.atbl tr:last-child td{border-bottom:none}
.atbl tr:hover td{background:#fafafa}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.tag.접수{background:#f6ffed;color:#237804}
.tag.대기{background:#fff7e6;color:#873800}
.btn-danger{font-size:13px;padding:6px 14px;border-radius:8px;border:1px solid #ffccc7;background:transparent;color:#cf1322;cursor:pointer;font-family:inherit}
.btn-danger:hover{background:#fff2f0}
.btn-export{font-size:13px;padding:6px 14px;border-radius:8px;border:1px solid #d9d9d9;background:#fff;color:#555;cursor:pointer;font-family:inherit;margin-right:8px}
.btn-export:hover{background:#f5f5f5}
.toast{border-radius:8px;padding:11px 16px;font-size:14px;margin-bottom:1rem;display:none}
.toast.show{display:block}
.toast.ok{background:#f6ffed;color:#237804;border:1px solid #b7eb8f}
.slot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.slot-card{background:#fff;border:1px solid #e8e8e8;border-radius:8px;padding:10px 12px;font-size:13px}
.slot-card.full{border-color:#ffccc7;background:#fff2f0}
.slot-card.soon{border-color:#ffd591;background:#fff7e6}
.slot-name{font-weight:500;margin-bottom:4px}
.slot-sub{color:#888;font-size:12px}
.slot-count{font-size:18px;font-weight:600;margin-top:6px}
.slot-count.full{color:#f5222d}
.slot-count.soon{color:#fa8c16}
.slot-count.ok{color:#237804}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div>
      <h1>운영자 관리 페이지</h1>
      <p>들락날락 영어랑 놀자 / Ocean Craft English</p>
    </div>
    <span class="admin-badge">🔒 운영자 전용</span>
  </div>

  <div class="toast" id="toast"></div>

  <div class="metrics">
    <div class="metric"><div class="metric-label">전체 신청</div><div class="metric-value" id="a-total">0</div></div>
    <div class="metric"><div class="metric-label">접수</div><div class="metric-value" id="a-acc">0</div></div>
    <div class="metric"><div class="metric-label">대기</div><div class="metric-value" id="a-wait">0</div></div>
    <div class="metric"><div class="metric-label">마감 회차</div><div class="metric-value" id="a-closed">0</div></div>
  </div>

  <!-- 알림 로그 -->
  <div class="card">
    <div class="card-title">
      <span>🔔 마감 알림 로그 <span style="font-size:12px;color:#aaa;font-weight:400">book@bscf.or.kr</span></span>
    </div>
    <div class="nlog" id="nlog"><div class="empty">발송된 알림이 없습니다.</div></div>
  </div>

  <!-- 신청 내역 -->
  <div class="card">
    <div class="card-title">
      <span>📋 신청 내역 전체</span>
      <div>
        <button class="btn-export" onclick="exportCSV()">CSV 다운로드</button>
        <button class="btn-danger" onclick="resetAll()">전체 초기화</button>
      </div>
    </div>
    <div class="filters">
      <span class="flabel">상태</span>
      <button class="fbtn on" onclick="filt('all',this)">전체</button>
      <button class="fbtn" onclick="filt('접수',this)">접수</button>
      <button class="fbtn" onclick="filt('대기',this)">대기</button>
    </div>
    <div class="atbl-wrap">
      <table class="atbl">
        <thead>
          <tr><th>#</th><th>아동 이름</th><th>생년월일</th><th>보호자 연락처</th><th>날짜</th><th>프로그램</th><th>회차</th><th>접수 상태</th><th>제출 시간</th></tr>
        </thead>
        <tbody id="atbody">
          <tr><td colspan="9" style="text-align:center;padding:2rem;color:#bbb">신청 내역이 없습니다.</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- 회차별 현황 -->
  <div class="card">
    <div class="card-title"><span>📊 회차별 신청 현황</span></div>
    <div class="filters">
      <span class="flabel">날짜</span>
      <button class="fbtn on" onclick="filtSlot('all',this)">전체</button>
      <button class="fbtn" onclick="filtSlot('8월 11일(화)',this)">8/11(화)</button>
      <button class="fbtn" onclick="filtSlot('8월 12일(수)',this)">8/12(수)</button>
      <button class="fbtn" onclick="filtSlot('8월 13일(목)',this)">8/13(목)</button>
    </div>
    <div class="slot-grid" id="slot-grid"></div>
  </div>
</div>

<script>
const DATES=['8월 11일(화)','8월 12일(수)','8월 13일(목)'];
const PROGS=['Ocean Maracas','My Beach Bag','Ocean Breeze Fan','Ding a Ring Guitar'];
const TIMES=['16시','17시','18시','19시','20시'];
const CAP=4;
const SK='ocef_v1';
let state={slots:{},apps:[],notifs:[]};
let filtStatus='all';
let filtDate='all';

function key(d,p,t){return d+'|'+p+'|'+t;}
function initSlots(){DATES.forEach(d=>PROGS.forEach(p=>TIMES.forEach(t=>{const k=key(d,p,t);if(!state.slots[k])state.slots[k]={date:d,prog:p,time:t,count:0,notified:false};})));}
function slotSt(c){return c>=CAP?'마감':c===CAP-1?'마감 임박':'신청 가능';}

function load(){
  try{const r=localStorage.getItem(SK);if(r)state=JSON.parse(r);}catch(e){}
  initSlots();render();
}

function render(){
  renderMetrics();renderNotifs();renderTable();renderSlots();
}

function renderMetrics(){
  let closed=0;
  Object.keys(state.slots).forEach(k=>{if(state.slots[k].count>=CAP)closed++;});
  document.getElementById('a-total').textContent=state.apps.length;
  document.getElementById('a-acc').textContent=state.apps.filter(x=>x.status==='접수').length;
  document.getElementById('a-wait').textContent=state.apps.filter(x=>x.status==='대기').length;
  document.getElementById('a-closed').textContent=closed;
}

function renderNotifs(){
  const el=document.getElementById('nlog');
  if(!state.notifs.length){el.innerHTML='<div class="empty">발송된 알림이 없습니다.</div>';return;}
  el.innerHTML=state.notifs.map(n=>'<div class="nitem"><div class="nitem-dot"></div><div><div>'+n.msg+'</div><div style="font-size:11px;color:#bbb;margin-top:2px">book@bscf.or.kr · '+n.time+'</div></div></div>').join('');
}

function renderTable(){
  const tbody=document.getElementById('atbody');
  const filtered=state.apps.filter(a=>filtStatus==='all'||a.status===filtStatus);
  if(!filtered.length){tbody.innerHTML='<tr><td colspan="9" style="text-align:center;padding:2rem;color:#bbb">신청 내역이 없습니다.</td></tr>';return;}
  tbody.innerHTML=filtered.map((a,i)=>'<tr>'
    +'<td style="color:#bbb">'+(i+1)+'</td>'
    +'<td style="font-weight:600">'+a.name+'</td>'
    +'<td>'+a.birth+'</td>'
    +'<td>'+a.phone+'</td>'
    +'<td>'+a.date+'</td>'
    +'<td>'+a.prog+'</td>'
    +'<td>'+a.time+'</td>'
    +'<td><span class="tag '+a.status+'">'+a.status+'</span></td>'
    +'<td style="color:#bbb;font-size:12px">'+a.at+'</td>'
    +'</tr>').join('');
}

function renderSlots(){
  const grid=document.getElementById('slot-grid');
  const cards=[];
  DATES.forEach(d=>{
    if(filtDate!=='all'&&filtDate!==d)return;
    PROGS.forEach(p=>{
      TIMES.forEach(t=>{
        const s=state.slots[key(d,p,t)];
        const st=slotSt(s.count);
        const cls=st==='마감'?'full':st==='마감 임박'?'soon':'';
        const cc=st==='마감'?'full':st==='마감 임박'?'soon':'ok';
        cards.push('<div class="slot-card '+cls+'">'
          +'<div class="slot-name">'+t+'</div>'
          +'<div class="slot-sub">'+d+'</div>'
          +'<div class="slot-sub">'+p+'</div>'
          +'<div class="slot-count '+cc+'">'+s.count+' / '+CAP+'명</div>'
          +'</div>');
      });
    });
  });
  grid.innerHTML=cards.length?cards.join(''):'<div class="empty">데이터 없음</div>';
}

function filt(val,btn){
  filtStatus=val;
  btn.parentElement.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  renderTable();
}

function filtSlot(val,btn){
  filtDate=val;
  btn.parentElement.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  renderSlots();
}

function exportCSV(){
  if(!state.apps.length){showToast('다운로드할 데이터가 없습니다.','ok');return;}
  const header='#,아동이름,생년월일,보호자연락처,날짜,프로그램,회차,접수상태,제출시간';
  const rows=state.apps.map((a,i)=>[i+1,a.name,a.birth,a.phone,a.date,a.prog,a.time,a.status,a.at].join(','));
  const csv='\uFEFF'+header+'\n'+rows.join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='바다도서관_신청내역.csv';a.click();
  URL.revokeObjectURL(url);
  showToast('CSV 다운로드 완료','ok');
}

function showToast(msg,type){
  const el=document.getElementById('toast');
  el.textContent=msg;el.className='toast show '+type;
  setTimeout(()=>{el.className='toast';},3000);
}

function resetAll(){
  if(!confirm('전체 데이터를 초기화하시겠습니까?\n이 작업은 되돌릴 수 없습니다.'))return;
  state={slots:{},apps:[],notifs:[]};
  initSlots();
  try{localStorage.setItem(SK,JSON.stringify(state));}catch(e){}
  render();
  showToast('초기화 완료','ok');
}

load();
</script>
</body>
</html>
